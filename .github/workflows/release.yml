# Builds, signs and uploads courrier to a release for each v* tag,
# as docs/github-actions.md of MyGo shows. Without the MYGO_UPDATER_PRIVATE_KEY
# secret and updates.github in mygo.json it uploads the installers only (no
# auto-updates); macOS signing and notarization need the secrets and the
# signingIdentity that the doc's "Signing and notarizing macOS apps" lists.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release, and the uploads to it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the notes need the commits since the previous tag
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          range="${previous:+$previous..}$GITHUB_REF_NAME"

          # Prints one section of the notes, from the commits of one Conventional Commits type.
          section() {
            entries="$(git log --no-merges --format=%s "$range" |
              sed -nE "s/^$2(\(([^)]*)\))?!?: (.*)/- \2: \3/p" | sed 's/^- : /- /')"

            if [ -n "$entries" ]; then
              printf '## %s\n\n%s\n\n' "$1" "$entries"
            fi
          }

          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "$(section Features feat; section Fixes fix; section Performance perf)"
          fi

  build:
    needs: release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Check that the tag is mygo.json's version
        run: test "v$(jq -r .version mygo.json)" = "$GITHUB_REF_NAME"
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Import the certificate and the notary credentials
        if: runner.os == 'macOS' && env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      # mygo build downloads this library without a token, and one failed
      # download fails the build, so fetch each target's into the cache it reads.
      - name: Fetch the SQLite libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go mod download github.com/egoist/mygo
          manifest="$(go list -m -f '{{.Dir}}' github.com/egoist/mygo)/plugins/sqlite/mygo-plugin.json"
          cache="${XDG_CACHE_HOME:-$HOME/.cache}"

          if [ "$RUNNER_OS" = macOS ]; then
            cache="$HOME/Library/Caches"
          fi

          for platform in $(tr , ' ' <<< "${{ matrix.platform }}"); do
            file=$(jq -c --arg p "${platform/\//-}" '.libraries[] | select(.name == "mygo-sqlite3").files[$p]' "$manifest")
            url=$(jq -r .url <<< "$file")
            sha=$(jq -r .sha256 <<< "$file")
            path="$cache/mygo/natives/$sha/$(jq -r .name <<< "$file")"
            mkdir -p "$(dirname "$path")"
            gh release download "$(cut -d/ -f8 <<< "$url")" --repo "$(cut -d/ -f4-5 <<< "$url")" --pattern "$(cut -d/ -f9 <<< "$url")" --output "$path"
            echo "$sha  $path" | shasum -a 256 -c
          done
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          # The OAuth clients for "Sign in with Google / Microsoft"; an unset
          # secret links in "", which hides that sign-in.
          MYGO_LDFLAGS: >-
            -X courrier/mail.GoogleClientID=${{ secrets.GOOGLE_CLIENT_ID }}
            -X courrier/mail.GoogleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
            -X courrier/mail.MicrosoftClientID=${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          if [ -n "$MYGO_UPDATER_PRIVATE_KEY" ] && jq -e .updates.github mygo.json > /dev/null; then
            go tool mygo build -platform "${{ matrix.platform }}" -upload
          else
            # shortcut: no updater key or updates.github yet, so the installers
            # go up without update files and installed copies can't self-update.
            echo "::warning::No updater key or updates.github: uploading installers only, without auto-updates"
            go tool mygo build -platform "${{ matrix.platform }}"
            shopt -s nullglob
            files=(build/*/*.dmg build/*/*Setup*.exe build/*/*.deb build/*/*.tar.gz)
            if [ -f build/linux-amd64/install.sh ]; then files+=(build/linux-amd64/install.sh); fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi
